[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foldplan"
version = "0.1.0"
description = "Plan chronological train/test splits using label availability dates."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
foldplan = "foldplan.__main__:main"

[tool.setuptools.packages.find]
include = ["foldplan*"]
